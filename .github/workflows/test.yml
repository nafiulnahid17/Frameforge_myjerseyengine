name: Frame Forge engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and native media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core ghostscript libcairo2
      - name: Verify FFmpeg test prerequisites
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          ffmpeg -hide_banner -encoders | grep -q libx264
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m compileall -q frameforge_engine

