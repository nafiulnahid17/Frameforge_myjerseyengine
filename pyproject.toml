[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-jersey-frame-forge-engine"
version = "0.1.0"
description = "Lightweight OpenRouter orchestration engine for template-driven mockup and video generation."
requires-python = ">=3.11"
dependencies = [
  "CairoSVG>=2.7,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
frame-forge-engine = "frameforge_engine.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frameforge_engine*"]

[tool.setuptools.package-data]
frameforge_engine = ["static/templates/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

